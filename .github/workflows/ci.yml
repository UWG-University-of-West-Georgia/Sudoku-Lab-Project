name: CI Pipeline

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches:
     - "dev"
     - "release"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Run Maven Verify
        run: mvn -B clean verify
