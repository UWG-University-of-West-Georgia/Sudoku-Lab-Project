name: CI Pipeline

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches:
      - "dev"
      - "release"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Maven Verify
        run: |
          echo "Testing Sudoku Project"
          cd "code"
          mvn --batch-mode --update-snapshots clean verify